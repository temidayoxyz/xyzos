# XYZ OS: deploy to Cloudflare Workers on every push to main.
#
# Required repository configuration (one-time):
#   - Settings -> Secrets and variables -> Actions:
#     * Secret  CLOUDFLARE_API_TOKEN  (Cloudflare API token with Workers Scripts:Edit,
#                                      Workers KV:Edit, Workers R2:Edit permissions)
#     * Variable CLOUDFLARE_ACCOUNT_ID (your Cloudflare account id)
#     * Variable ADMINS               (comma-separated admin usernames, default "admin")
#     * Optional secrets for gatekeeper OAuth apps (GITHUB_CLIENT_ID, GOOGLE_CLIENT_ID, ...)
#
# Every push to main runs: install -> lint + type-check -> tests -> deploy.
# See scripts/deploy.mjs and docs/DEPLOYING.md for what the deploy step does.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "22.14.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Deploy to Cloudflare
        run: node scripts/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ADMINS: ${{ vars.ADMINS }}
          SHARING_DOMAIN: ${{ vars.SHARING_DOMAIN }}
          # Optional gatekeeper OAuth credentials (omit the secrets you don't configure).
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_OAUTH_CLIENT_ID: ${{ secrets.CLOUDFLARE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_OAUTH_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_OAUTH_CLIENT_SECRET }}
          SUPABASE_CLIENT_ID: ${{ secrets.SUPABASE_CLIENT_ID }}
          SUPABASE_CLIENT_SECRET: ${{ secrets.SUPABASE_CLIENT_SECRET }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          ZOOMINFO_CLIENT_ID: ${{ secrets.ZOOMINFO_CLIENT_ID }}
          ZOOMINFO_CLIENT_SECRET: ${{ secrets.ZOOMINFO_CLIENT_SECRET }}
          CONFLUENCE_CLIENT_ID: ${{ secrets.CONFLUENCE_CLIENT_ID }}
          CONFLUENCE_CLIENT_SECRET: ${{ secrets.CONFLUENCE_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
